seed: 37

model:
  seq2seq_name: google-t5/t5-small
  input_prefix: "answer question: "

data:
  source: hotpotqa
  dataset_name: hotpotqa/hotpot_qa
  dataset_config: distractor
  train_split: train
  validation_split: validation
  train_examples: 3000
  validation_examples: 512
  question_prefix: "question:"
  context_prefix: "context:"
  max_context_words: 256
  source_max_length: 384
  target_max_length: 32

training:
  output_dir: runs/t5_small_hotpotqa_3k_seed37
  device: cuda
  precision: bf16
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 1500
  learning_rate: 0.0001
  warmup_steps: 150
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 100
  eval_every: 375
  save_every: 750

generation:
  max_new_tokens: 16
  min_new_tokens: 1
  num_samples: 8
  do_sample: false
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
  num_beams: 4
  length_penalty: 1.0
