seed: 37

model:
  seq2seq_name: google-t5/t5-large
  input_prefix: "answer question: "
  lora:
    enabled: true
    r: 8
    alpha: 32
    target_modules: ["q", "v"]
    dropout: 0.05

data:
  source: hotpotqa
  dataset_name: hotpotqa/hotpot_qa
  dataset_config: distractor
  train_split: train
  validation_split: validation
  train_examples: 30000
  validation_examples: 256
  question_prefix: "question:"
  context_prefix: "context:"
  max_context_words: 256
  source_max_length: 384
  target_max_length: 32

training:
  output_dir: runs/t5_large_lora_r8_hotpotqa_30k_seed37
  device: cuda
  precision: bf16
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 3000
  learning_rate: 0.0003
  warmup_steps: 300
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 100
  eval_every: 750
  save_every: 1500

generation:
  max_new_tokens: 16
  min_new_tokens: 1
  num_samples: 8
  do_sample: false
  num_beams: 4
  length_penalty: 1.0
