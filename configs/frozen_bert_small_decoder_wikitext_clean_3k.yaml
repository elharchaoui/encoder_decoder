seed: 13

model:
  encoder_name: google-bert/bert-base-uncased
  decoder_layers: 4
  decoder_heads: 8
  decoder_ffn_dim: 3072
  dropout: 0.1
  init_decoder_embeddings_from_encoder: true
  tie_token_embeddings: true
  use_cross_attention: true

data:
  source: wikitext
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  train_split: train
  validation_split: validation
  train_examples: 2000
  validation_examples: 256
  source_max_length: 64
  target_max_length: 64
  min_words: 8
  max_words: 40
  corruption:
    token_delete_prob: 0.22
    token_mask_prob: 0.18
    function_word_delete_prob: 0.6
    span_delete_prob: 0.45
    span_mask_prob: 0.35
    min_span_length: 2
    max_span_length: 6
    shuffle_window_prob: 0.15
    min_keep_ratio: 0.35
    remove_punctuation: true

training:
  output_dir: runs/frozen_bert_small_decoder_wikitext_clean_3k
  device: cuda
  precision: bf16
  batch_size: 8
  gradient_accumulation_steps: 4
  max_steps: 3000
  learning_rate: 0.0003
  warmup_steps: 150
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 100
  eval_every: 500
  save_every: 1000

generation:
  max_new_tokens: 64
  num_samples: 5
  do_sample: false
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
