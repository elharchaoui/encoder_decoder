seed: 37

model:
  seq2seq_name: google-t5/t5-large
  input_prefix: "answer question: "
  train_only_patterns:
    - ".EncDecAttention."
    - "decoder.final_layer_norm"

data:
  source: qa
  objective: extractive_qa
  dataset_name: rajpurkar/squad
  train_split: train
  validation_split: validation
  train_examples: 30000
  validation_examples: 512
  question_prefix: "question:"
  context_prefix: "context:"
  source_max_length: 384
  target_max_length: 32

generation:
  checkpoint_dir: runs/t5_large_cross_attention_only_squad_30k_seed37/best
  output_file: reports/t5_large_cross_attention_only_squad_30k_seed37_eval.md
  max_new_tokens: 32
  min_new_tokens: 1
  num_samples: 8
  do_sample: false
  num_beams: 4
  length_penalty: 1.0
  batch_size: 8
