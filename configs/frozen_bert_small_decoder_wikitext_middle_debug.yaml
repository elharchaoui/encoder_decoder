seed: 17

model:
  encoder_name: google-bert/bert-base-uncased
  decoder_layers: 4
  decoder_heads: 8
  decoder_ffn_dim: 3072
  dropout: 0.1
  init_decoder_embeddings_from_encoder: true
  tie_token_embeddings: true
  use_cross_attention: true

data:
  source: wikitext
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  train_split: train
  validation_split: validation
  train_examples: 2000
  validation_examples: 256
  source_max_length: 64
  target_max_length: 64
  min_words: 8
  max_words: 40
  corruption:
    token_delete_prob: 0.14
    token_mask_prob: 0.12
    function_word_delete_prob: 0.35
    span_delete_prob: 0.2
    span_mask_prob: 0.15
    min_span_length: 2
    max_span_length: 4
    shuffle_window_prob: 0.08
    min_keep_ratio: 0.55
    remove_punctuation: true

training:
  output_dir: runs/frozen_bert_small_decoder_wikitext_middle_debug
  device: cuda
  precision: bf16
  batch_size: 8
  gradient_accumulation_steps: 4
  max_steps: 1000
  learning_rate: 0.0003
  warmup_steps: 100
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 50
  eval_every: 250
  save_every: 500

generation:
  max_new_tokens: 64
  min_new_tokens: 8
  num_samples: 5
  do_sample: false
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  repetition_penalty: 1.15
  no_repeat_ngram_size: 3
  num_beams: 4
  length_penalty: 0.8
