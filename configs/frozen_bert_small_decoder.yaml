seed: 13

model:
  encoder_name: google-bert/bert-base-uncased
  decoder_layers: 4
  decoder_heads: 8
  decoder_ffn_dim: 3072
  dropout: 0.1
  init_decoder_embeddings_from_encoder: true
  tie_token_embeddings: true

data:
  source: synthetic
  train_examples: 128
  validation_examples: 32
  source_max_length: 64
  target_max_length: 64

training:
  output_dir: runs/frozen_bert_small_decoder
  device: cuda
  precision: bf16
  batch_size: 8
  gradient_accumulation_steps: 4
  max_steps: 200
  learning_rate: 0.0003
  warmup_steps: 20
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 10
  eval_every: 50
  save_every: 100

generation:
  max_new_tokens: 64
  num_samples: 5
