seed: 37

model:
  decoder_name: gpt2-large
  prompt_prefix: "answer question: "
  answer_prefix: "\nanswer: "

data:
  source: hotpotqa
  dataset_name: hotpotqa/hotpot_qa
  dataset_config: distractor
  train_split: train
  validation_split: validation
  train_examples: 30000
  validation_examples: 256
  question_prefix: "question:"
  context_prefix: "context:"
  max_context_words: 256
  source_max_length: 384
  target_max_length: 32

training:
  output_dir: runs/gpt2_large_hotpotqa_30k_seed37
  device: cuda
  precision: bf16
  batch_size: 2
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  max_steps: 3000
  learning_rate: 0.00005
  warmup_steps: 300
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 100
  eval_every: 750
  save_every: 1500

generation:
  max_new_tokens: 16
  min_new_tokens: 1
  num_samples: 8
  num_beams: 4
