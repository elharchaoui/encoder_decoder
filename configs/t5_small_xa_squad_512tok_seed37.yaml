seed: 37

model:
  seq2seq_name: google-t5/t5-small
  input_prefix: "answer question: "
  train_only_patterns:
    - ".EncDecAttention."
    - "decoder.final_layer_norm"

data:
  source: qa
  objective: extractive_qa
  dataset_name: rajpurkar/squad
  train_split: train
  validation_split: validation
  train_examples: 3000
  validation_examples: 256
  question_prefix: "question:"
  context_prefix: "context:"
  source_max_length: 512
  target_max_length: 32

training:
  output_dir: runs/t5_small_xa_squad_512tok_seed37
  device: cuda
  precision: bf16
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 1500
  learning_rate: 0.0002
  warmup_steps: 150
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 100
  eval_every: 375
  save_every: 750

generation:
  max_new_tokens: 16
  min_new_tokens: 1
  num_samples: 8
  do_sample: false
  num_beams: 4
  length_penalty: 1.0
