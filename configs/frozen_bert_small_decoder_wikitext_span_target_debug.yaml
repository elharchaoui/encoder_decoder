seed: 23

model:
  encoder_name: google-bert/bert-base-uncased
  decoder_layers: 4
  decoder_heads: 8
  decoder_ffn_dim: 3072
  dropout: 0.1
  init_decoder_embeddings_from_encoder: true
  tie_token_embeddings: true
  use_cross_attention: true

data:
  source: wikitext
  objective: span_target
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  train_split: train
  validation_split: validation
  train_examples: 3000
  validation_examples: 256
  source_max_length: 64
  target_max_length: 24
  min_words: 10
  max_words: 40
  span_target:
    sentinel_token: "[unused1]"
    min_span_length: 2
    max_span_length: 6
    min_left_words: 2
    min_right_words: 2

training:
  output_dir: runs/frozen_bert_small_decoder_wikitext_span_target_debug
  device: cuda
  precision: bf16
  batch_size: 8
  gradient_accumulation_steps: 4
  max_steps: 1200
  learning_rate: 0.0003
  warmup_steps: 120
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 50
  eval_every: 300
  save_every: 600

generation:
  max_new_tokens: 16
  min_new_tokens: 1
  num_samples: 8
  do_sample: true
  temperature: 0.8
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.1
  no_repeat_ngram_size: 2
  num_beams: 1
  length_penalty: 1.0
