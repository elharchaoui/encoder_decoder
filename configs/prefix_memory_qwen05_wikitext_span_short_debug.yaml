seed: 31

model:
  encoder_name: thenlper/gte-small
  decoder_name: Qwen/Qwen2-0.5B-Instruct
  source_prefix: "recover missing span: "
  decoder_prefix: "Missing span:"
  decoder_baseline_prompt: "Recover the missing span.\nText: {source}\nMissing span:"
  memory_tokens: 64
  bridge_heads: 8
  bridge_dropout: 0.0
  freeze_encoder: true
  freeze_decoder: true

data:
  source: wikitext
  objective: span_target
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  train_split: train
  validation_split: validation
  train_examples: 3000
  validation_examples: 256
  source_max_length: 96
  target_max_length: 16
  min_words: 8
  max_words: 40
  span_target:
    sentinel_token: "<missing>"
    min_span_length: 1
    max_span_length: 3
    min_left_words: 2
    min_right_words: 2

training:
  output_dir: runs/prefix_memory_qwen05_wikitext_span_short_debug_v2
  device: cuda
  precision: bf16
  batch_size: 2
  gradient_accumulation_steps: 16
  max_steps: 600
  learning_rate: 0.0005
  warmup_steps: 60
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 50
  eval_every: 150
  save_every: 300

generation:
  max_new_tokens: 10
  min_new_tokens: 1
  num_samples: 8
