seed: 29

model:
  encoder_name: google-bert/bert-base-uncased
  decoder_layers: 4
  decoder_heads: 8
  decoder_ffn_dim: 3072
  dropout: 0.1
  init_decoder_embeddings_from_encoder: true
  init_decoder_layers_from_encoder: true
  tie_token_embeddings: true
  use_cross_attention: true

data:
  source: wikitext
  objective: span_target
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  train_split: train
  validation_split: validation
  train_examples: 3000
  validation_examples: 256
  source_max_length: 64
  target_max_length: 16
  min_words: 8
  max_words: 40
  span_target:
    sentinel_token: "[unused1]"
    min_span_length: 1
    max_span_length: 3
    min_left_words: 2
    min_right_words: 2

training:
  output_dir: runs/frozen_bert_warm_decoder_wikitext_span_short_debug
  device: cuda
  precision: bf16
  batch_size: 8
  gradient_accumulation_steps: 4
  max_steps: 900
  learning_rate: 0.0001
  warmup_steps: 90
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  log_every: 50
  eval_every: 225
  save_every: 450

generation:
  max_new_tokens: 10
  min_new_tokens: 1
  num_samples: 8
  do_sample: true
  temperature: 0.8
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.1
  no_repeat_ngram_size: 2
  num_beams: 1
  length_penalty: 1.0
