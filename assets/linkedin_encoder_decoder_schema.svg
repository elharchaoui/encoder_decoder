<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Encoder-decoder inference schema for large input context</title>
  <desc id="desc">A side-by-side comparison showing decoder-only inference attending to a growing KV cache, versus encoder-decoder inference encoding context once and reusing static semantic memory through cross-attention.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 52px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 25px; font-weight: 400; fill: #475569; }
      .panel-title { font-size: 34px; font-weight: 800; fill: #111827; }
      .panel-subtitle { font-size: 20px; font-weight: 500; fill: #475569; }
      .label { font-size: 20px; font-weight: 700; fill: #111827; }
      .small { font-size: 17px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 15px; font-weight: 600; fill: #64748b; }
      .callout { font-size: 22px; font-weight: 800; fill: #111827; }
      .metric { font-size: 25px; font-weight: 800; fill: #0f172a; }
      .box { stroke-width: 2; rx: 16; filter: url(#shadow); }
      .token { stroke-width: 1.5; rx: 8; }
      .arrow { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin-arrow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>

  <text x="800" y="72" text-anchor="middle" class="title">Encoder-decoder for cheaper long-context inference</text>
  <text x="800" y="113" text-anchor="middle" class="subtitle">Decoder-only grows the KV cache. Encoder-decoder encodes context once, then reuses it.</text>

  <rect x="70" y="155" width="700" height="605" rx="28" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <rect x="830" y="155" width="700" height="605" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>

  <text x="110" y="210" class="panel-title">Decoder-only inference</text>
  <text x="110" y="242" class="panel-subtitle">Every generated token attends to the full prefix.</text>

  <text x="870" y="210" class="panel-title">Encoder-decoder inference</text>
  <text x="870" y="242" class="panel-subtitle">Context is encoded once into reusable semantic memory.</text>

  <!-- Left panel: decoder-only -->
  <rect x="110" y="292" width="235" height="74" class="box" fill="#ffffff" stroke="#fb923c"/>
  <text x="227" y="324" text-anchor="middle" class="label">Large input context</text>
  <text x="227" y="350" text-anchor="middle" class="small">documents, chat, tools</text>

  <line x1="345" y1="329" x2="430" y2="329" class="arrow" stroke="#ea580c" marker-end="url(#arrowOrange)"/>

  <rect x="430" y="279" width="250" height="100" class="box" fill="#ffffff" stroke="#f97316"/>
  <text x="555" y="314" text-anchor="middle" class="label">Decoder-only model</text>
  <text x="555" y="343" text-anchor="middle" class="small">self-attention over</text>
  <text x="555" y="367" text-anchor="middle" class="small">context + output</text>

  <text x="110" y="425" class="label">KV cache grows during generation</text>
  <rect x="110" y="450" width="520" height="84" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <rect x="135" y="475" width="48" height="34" class="token" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="193" y="475" width="48" height="34" class="token" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="251" y="475" width="48" height="34" class="token" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="309" y="475" width="48" height="34" class="token" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="367" y="475" width="48" height="34" class="token" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="425" y="475" width="48" height="34" class="token" fill="#fed7aa" stroke="#ea580c"/>
  <rect x="483" y="475" width="48" height="34" class="token" fill="#fed7aa" stroke="#ea580c"/>
  <rect x="541" y="475" width="48" height="34" class="token" fill="#fed7aa" stroke="#ea580c"/>
  <text x="620" y="499" class="metric">...</text>
  <text x="135" y="563" class="tiny">input tokens</text>
  <text x="425" y="563" class="tiny">generated tokens</text>

  <path d="M 555 382 C 555 420, 555 430, 555 450" class="thin-arrow" stroke="#ea580c" marker-end="url(#arrowOrange)"/>

  <rect x="150" y="606" width="480" height="92" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="390" y="638" text-anchor="middle" class="callout">Inference cost grows with context length</text>
  <text x="390" y="670" text-anchor="middle" class="small">Each new token reads more cached keys and values.</text>

  <!-- Right panel: encoder-decoder -->
  <rect x="870" y="292" width="235" height="74" class="box" fill="#ffffff" stroke="#60a5fa"/>
  <text x="988" y="324" text-anchor="middle" class="label">Large input context</text>
  <text x="988" y="350" text-anchor="middle" class="small">documents, chat, tools</text>

  <line x1="1105" y1="329" x2="1190" y2="329" class="arrow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>

  <rect x="1190" y="279" width="250" height="100" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="1315" y="314" text-anchor="middle" class="label">Encoder</text>
  <text x="1315" y="343" text-anchor="middle" class="small">runs once</text>
  <text x="1315" y="367" text-anchor="middle" class="small">before decoding</text>

  <path d="M 1315 382 C 1315 422, 1315 442, 1315 470" class="arrow" stroke="#16a34a" marker-end="url(#arrowGreen)"/>

  <rect x="1060" y="470" width="510" height="94" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1315" y="505" text-anchor="middle" class="label">Static semantic memory</text>
  <text x="1315" y="535" text-anchor="middle" class="small">encoder hidden states reused for all output tokens</text>

  <rect x="870" y="600" width="250" height="96" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="995" y="636" text-anchor="middle" class="label">Decoder</text>
  <text x="995" y="666" text-anchor="middle" class="small">generates answer tokens</text>

  <path d="M 1060 640 C 1110 610, 1175 580, 1240 564" class="thin-arrow" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
  <text x="1122" y="603" class="tiny">cross-attention</text>

  <rect x="1185" y="612" width="240" height="54" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="1305" y="647" text-anchor="middle" class="label">Output tokens</text>

  <rect x="905" y="704" width="560" height="82" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="1185" y="736" text-anchor="middle" class="callout">Large context cost is mostly paid once</text>
  <text x="1185" y="765" text-anchor="middle" class="small">Decoding uses fixed encoder memory instead of re-reading the full prefix.</text>

  <!-- Center comparison badge -->
  <rect x="585" y="800" width="430" height="58" rx="20" fill="#0f172a" opacity="0.96"/>
  <text x="800" y="824" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Key idea</text>
  <text x="800" y="847" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#dbeafe">Separate context understanding from token generation</text>

  <!-- Footer -->
  <text x="800" y="882" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#64748b">For long-context QA, RAG, and agents, this can improve the quality-latency-memory tradeoff.</text>
</svg>
